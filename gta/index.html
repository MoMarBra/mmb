  <body>
    <div id="boot-screen" aria-label="Spiel wird geladen" role="status" style="position:fixed;inset:0;z-index:80;background:#000"></div>
    <script>
      // Accept Space immediately, even before the game modules have finished loading.
      window.__bbeBoot = { skipIntro: false, spaceHeld: false };
      (function () {
        function skip(e) {
          if (e.code !== 'Space') return;
          e.preventDefault();
          e.stopImmediatePropagation();
          window.__bbeBoot.skipIntro = true;
          window.__bbeBoot.spaceHeld = true;
        }
        function release(e) {
          if (e.code !== 'Space') return;
          window.__bbeBoot.spaceHeld = false;
          e.preventDefault();
          e.stopImmediatePropagation();
        }
        window.addEventListener('keydown', skip, true);
        window.addEventListener('keyup', release, true);
        window.__bbeBoot.takeOver = function () {
          window.removeEventListener('keydown', skip, true);
          window.removeEventListener('keyup', release, true);
        };
      })();
    </script>
    <canvas id="world" tabindex="0" aria-label="3D-Spielwelt"></canvas>
    <div id="ui"></div>
    <div id="modal-root"></div>
    <div id="toasts" aria-live="polite"></div>
    <script>
      window.addEventListener('error', function () {
        var el = document.getElementById('boot-screen');
        if (el) {
          el.style.cssText += ';display:grid;place-items:center;color:white;font:16px system-ui;padding:24px';
          el.textContent = 'Das Laden wurde unterbrochen. Bitte die Seite neu laden.';
        }
      });
    </script>
