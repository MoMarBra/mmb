<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#0b1226">
  <meta name="description" content="Snack Glücksrad und Bewertungen.">
  <title>Snack Glücksrad ™</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <script type="importmap">{"imports":{"three":"./vendor/three/three.module.js","three/addons/":"./vendor/three/addons/"}}</script>
</head>
<body>
  <a class="skip-link" href="#main">Zum Inhalt</a>
  <div class="app-shell">
    <header class="site-header">
      <h1 class="wordmark"><a href="./">Snack Glücksrad <sup>™</sup></a></h1>
      <div class="header-actions">
        <button class="icon-button" id="sound-toggle" aria-pressed="true" aria-label="Ton ausschalten" title="Ton ausschalten"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m11 5-5 4H3v6h3l5 4V5Z"/><path class="sound-waves" d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/><path class="sound-off" d="m16 9 5 6m0-6-5 6"/></svg></button>
        <button class="icon-button" id="refresh" aria-label="Daten neu laden" title="Neu laden"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M6.1 7a7 7 0 0 1 11.6-1L20 9M4 15l2.3 3A7 7 0 0 0 18 17"/></svg></button>
        <button class="profile-button" id="choose-person"><span class="avatar" id="my-avatar" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/></svg></span><span id="my-name">Dein Name</span><svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 10 4 4 4-4"/></svg></button>
      </div>
    </header>
    <nav class="tabs" role="tablist" aria-label="Ansichten">
      <button id="tab-wheel" role="tab" aria-selected="true" aria-controls="view-wheel" tabindex="0" data-tab="wheel">Glücksrad</button>
      <button id="tab-mine" role="tab" aria-selected="false" aria-controls="view-mine" tabindex="-1" data-tab="mine">Meine Bewertungen</button>
      <button id="tab-ranking" role="tab" aria-selected="false" aria-controls="view-ranking" tabindex="-1" data-tab="ranking">Gesamtübersicht</button>
    </nav>
    <main id="main">
      <div class="error-banner" id="global-error" role="alert" hidden><span></span><button class="text-button" id="retry-load">Erneut versuchen</button></div>
      <section id="view-wheel" role="tabpanel" aria-labelledby="tab-wheel">
        <h2 class="wheel-question">Was snacken wir heute?</h2>
        <span class="quiet-count" id="restaurant-count" hidden></span>
        <div class="play-layout">
          <section class="wheel-panel" aria-label="Restaurant auswählen">
            <div class="wheel-stage" id="wheel-stage">
              <canvas id="wheel-fallback" width="1000" height="1000" role="img" aria-label="Snack-Rad. Restaurants lassen sich auch über die Liste unter dem Rad auswählen."></canvas>
              <div id="wheel-3d" aria-hidden="true"></div>
              <button class="wheel-hub" id="wheel-hub" type="button" aria-label="Nabe antippen" disabled></button>
            </div>
            <div class="spin-actions"><button class="primary-button" id="spin" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M6.1 7a7 7 0 0 1 11.6-1L20 9M4 15l2.3 3A7 7 0 0 0 18 17"/></svg><span>Drehen</span></button></div>
          </section>
          <aside class="detail-panel" id="restaurant-detail" aria-labelledby="detail-title" aria-busy="true" hidden>
            <div class="detail-topline"><span class="eyebrow" id="selection-label">Bewertungen</span><span class="rank-badge" id="detail-rank"></span><button id="close-detail" class="icon-button" aria-label="Bewertungen schließen">×</button></div>
            <h2 id="detail-title" tabindex="-1">Einen Moment …</h2>
            <div class="rating-summary"><span class="score" id="detail-score">–</span><span class="score-context"><span id="detail-stars" class="display-stars" aria-hidden="true"></span><span id="detail-count">Bewertungen werden geladen</span></span></div>
            <div class="your-rating" id="quick-rating"></div>
            <div class="community-heading"><h3>Bewertungen</h3><span id="community-count"></span></div>
            <div id="community-list" class="community-list"></div>
            <button id="toggle-community" class="text-button" hidden>Alle Bewertungen anzeigen</button>
          </aside>
        </div>
        <section class="restaurant-picker" aria-labelledby="all-restaurants-title"><h2 id="all-restaurants-title" class="sr-only">Restaurants</h2><div class="restaurant-chips" id="restaurant-chips"></div></section>
      </section>
      <section id="view-mine" role="tabpanel" aria-labelledby="tab-mine" hidden>
        <div class="section-heading"><div><h2>Bewertungen</h2></div><button class="secondary-button" id="mine-change-person">Person wählen</button></div>
        <div id="mine-content"></div>
      </section>
      <section id="view-ranking" role="tabpanel" aria-labelledby="tab-ranking" hidden>
        <div class="section-heading"><div><h2>Gesamtübersicht</h2></div><span class="quiet-count" id="ranking-count"></span></div>
        <div class="list-toolbar"><label class="search-field"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="ranking-search" type="search" placeholder="Restaurant suchen" aria-label="Restaurant in der Rangliste suchen"></label><span class="muted">Nach Durchschnitt</span></div>
        <div class="ranking-list" id="ranking-list"></div>
      </section>
    </main>
    <footer><span id="data-mode" hidden></span><span>Speicherstatus:</span><span id="save-status" role="status" aria-live="polite">Wird geladen …</span><button id="retry-save" class="text-button" hidden>Erneut speichern</button><span id="people-count"></span></footer>
  </div>
  <dialog id="person-dialog" aria-labelledby="person-dialog-title"><div class="dialog-heading"><div><h2 id="person-dialog-title">Person wählen</h2></div><button id="close-person-dialog" class="icon-button" aria-label="Personenauswahl schließen">×</button></div><label class="search-field"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="person-search" type="search" placeholder="Deinen Namen suchen" autocomplete="off" aria-label="Person suchen"></label><div class="person-options" id="person-options"></div></dialog>
  <canvas id="confetti" aria-hidden="true"></canvas>
  <div id="announcement" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
  <noscript>Bitte aktiviere JavaScript, um das Snack-Rad und die Bewertungen zu verwenden.</noscript>
  <script type="module" src="./main.js"></script>
</body>
</html>
